<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica profilo - CinemaAnalisi</title>
    <link rel="stylesheet" href="style_profilo.css">
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <h1>Modifica profilo</h1>

            
            <div class="avatar-section">
                <img src="" alt="Avatar" id="avatar-preview" class="avatar">
                <label for="avatar-upload" class="btn-upload">Cambia foto profilo</label>
                <input type="file" id="avatar-upload" name="avatar" accept="image/*" style="display: none;">
            </div>

            <form id="profile-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required maxlength="30">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="50">
                </div>

                <div class="form-group">
                    <label for="password">Nuova password (lascia vuoto per non cambiare)</label>
                    <input type="password" id="password" name="password">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Conferma nuova password</label>
                    <input type="password" id="confirm-password" name="confirm_password">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Salva modifiche</button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='dashboard.html'">Annulla</button>
                </div>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="script_profilo.js"></script>
</body>
</html>
